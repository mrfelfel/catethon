[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catethon"
dynamic = ["version"]
description = "Cat-specific fork of Telethon, the asyncio MTProto client for Telegram"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Lonami Exo", email = "totufals@hotmail.com" },
    { name = "CatGram / the cat project" },
]
keywords = [
    "api",
    "chat",
    "client",
    "library",
    "messaging",
    "mtproto",
    "telegram",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "pyaes",
    "rsa",
]

[project.optional-dependencies]
cryptg = [
    "cryptg",
]
# catethon.cat.proxy honours PROXY/SOCKS5_PROXY the way the Go fetchers do;
# Telethon needs a SOCKS client for a proxy= argument, upstream keeps it out of
# the base deps, so it rides an extra named after what it enables.
socks = [
    "python-socks[asyncio]",
]

[project.urls]
Homepage = "https://telethon.dev"
Source = "https://codeberg.org/Lonami/Telethon"
Download = "https://codeberg.org/Lonami/Telethon/tags"
Documentation = "https://docs.telethon.dev"
Reference = "https://tl.telethon.dev"
"Fork of" = "https://github.com/mrfelfel/catethon"

[tool.hatch.version]
path = "catethon/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/catethon",
]
